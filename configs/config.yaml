# Main configuration file for NeMo Fine-Tuning Pipeline

# Model configuration
model:
  type: "llama2"  # Options: llama2, llama3, codellama
  size: "7b"      # Model size variant
  base_model_path: null  # Path to base model or HuggingFace model name
  
# Data configuration
data:
  train_file: "data/train.yaml"
  val_file: "data/val.yaml"
  test_file: "data/test.yaml"
  max_seq_length: 2048
  batch_size: 4
  num_workers: 4

# Training configuration
training:
  max_epochs: 3
  learning_rate: 2e-4
  warmup_steps: 100
  weight_decay: 0.01
  gradient_clip_val: 1.0
  accumulate_grad_batches: 4
  precision: "bf16"
  strategy: "ddp"
  
# LoRA configuration
lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.1
  target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
  
# Evaluation configuration
evaluation:
  eval_steps: 500
  save_steps: 1000
  metrics: ["perplexity", "bleu", "rouge"]
  
# Deployment configuration
deployment:
  output_dir: "deploy"
  model_name: null  # Will be auto-generated if null
  copy_tokenizer: true
  create_config: true
  
# Logging configuration
logging:
  log_dir: "logs"
  wandb_project: null
  tensorboard_dir: "logs/tensorboard"
  log_level: "INFO"
  
# Checkpoint configuration
checkpointing:
  checkpoint_dir: "checkpoints"
  save_top_k: 3
  monitor: "val_loss"
  mode: "min"
