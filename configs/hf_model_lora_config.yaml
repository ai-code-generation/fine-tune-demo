name: hf_model_lora_tuning

trainer:
  devices: 1
  num_nodes: 1
  accelerator: gpu
  precision: bf16
  logger: False
  enable_checkpointing: False
  use_distributed_sampler: False
  max_epochs: -1
  max_steps: 100
  max_time: "05:00:00:00"
  log_every_n_steps: 10
  val_check_interval: 0.25
  limit_val_batches: 50
  limit_test_batches: 500
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0

exp_manager:
  explicit_log_dir: null
  exp_dir: null
  name: hf_model_lora
  create_wandb_logger: False
  wandb_logger_kwargs:
    project: nemo_hf_lora
    name: hf_model_lora
  resume_if_exists: True
  resume_ignore_no_checkpoint: True
  create_checkpoint_callback: True
  checkpoint_callback_params:
    monitor: "val_loss"
    save_top_k: 2
    mode: "min"
    always_save_nemo: False
    save_nemo_on_train_end: True
    filename: "hf-model-lora--{val_loss:.2f}-{step}-{consumed_samples}"
    model_parallel_size: ${multiply:${model.tensor_model_parallel_size}, ${model.pipeline_model_parallel_size}}

model:
  seed: 1234
  tensor_model_parallel_size: 1
  pipeline_model_parallel_size: 1
  virtual_pipeline_model_parallel_size: null
  
  # HuggingFace model integration
  restore_from_path: null
  model_name_or_path: null  # Will be set to HF model name
  use_hf_model: true
  hf_model_path: null  # Will be set to local HF model path
  
  resume_from_checkpoint: null

  # model architecture (will be overridden by HF model)
  encoder_seq_length: 2048
  max_position_embeddings: 2048
  num_layers: 32
  hidden_size: 4096
  ffn_hidden_size: 11008
  num_attention_heads: 32
  num_query_groups: 32
  init_method_std: 0.01
  use_scaled_init_method: True
  hidden_dropout: 0.0
  attention_dropout: 0.0
  ffn_dropout: 0.0
  kv_channels: null
  apply_query_key_layer_scaling: False
  normalization: rmsnorm
  layernorm_epsilon: 1.0e-5
  do_layer_norm_weight_decay: False
  make_vocab_size_divisible_by: 128
  pre_process: True
  post_process: True
  persist_layer_norm: True
  bias: False
  activation: 'swiglu'
  headscale: False
  transformer_block_type: 'pre_ln'
  openai_gelu: False
  normalize_attention_scores: True
  position_embedding_type: 'rope'
  rotary_percentage: 1.0
  apply_rope_fusion: True
  attention_type: 'multihead'
  share_embeddings_and_output_weights: False
  overlap_p2p_comm: False
  batch_p2p_comm: True
  seq_len_interpolation_factor: null
  num_moe_experts: 1

  tokenizer:
    library: 'huggingface'
    type: null  # Will be set to HF model name
    use_fast: True

  # Sequence Parallelism
  sequence_parallel: False

  # Activation Checkpointing
  activations_checkpoint_granularity: null
  activations_checkpoint_method: null
  activations_checkpoint_num_layers: null
  num_micro_batches_with_partial_activation_checkpoints: null
  activations_checkpoint_layers_per_pipeline: null

  # FSDP
  fsdp: False
  fsdp_sharding_strategy: 'full'
  fsdp_grad_reduce_dtype: 32
  fsdp_sharded_checkpoint: False

  ## Network
  sharp: False

  ## Transformer Engine
  transformer_engine: True
  fp8: False
  fp8_e4m3: False
  fp8_hybrid: False
  fp8_margin: 0
  fp8_interval: 1
  fp8_amax_history_len: 1024
  fp8_amax_compute_algo: max
  reduce_amax: True
  use_emha: False

  # Mixed precision
  native_amp_init_scale: 4294967296
  native_amp_growth_interval: 1000
  hysteresis: 2
  fp32_residual_connection: False
  fp16_lm_cross_entropy: False

  # Megatron O2-style half-precision
  megatron_amp_O2: True
  grad_allreduce_chunk_size_mb: 125
  grad_div_ar_fusion: True

  # Fusion
  grad_sync_func: collective
  gradient_accumulation_fusion: False
  bias_activation_fusion: False
  bias_dropout_add_fusion: False
  masked_softmax_fusion: True

  # Miscellaneous
  seed: 1234
  use_cpu_initialization: False
  onnx_safe: False
  apex_transformer_log_level: 30

  # Nsys profiling options
  nsys_profile:
    enabled: False
    start_step: 10
    end_step: 10
    ranks: [0]
    gen_shape: False

  optim:
    name: fused_adam
    lr: 1e-4
    weight_decay: 0.01
    betas:
    - 0.9
    - 0.95
    sched:
      name: CosineAnnealing
      warmup_steps: 50
      constant_steps: 0
      min_lr: 1e-6

  # PEFT
  peft:
    peft_scheme: "lora"
    restore_from_path: null

    # LoRA
    lora_tuning:
      target_modules: ['attention_qkv', 'attention_dense', 'mlp_fc1', 'mlp_fc2']
      adapter_dim: 32
      adapter_dropout: 0.0
      column_init_method: 'xavier'
      row_init_method: 'zero'
      layer_selection: null
      weight_tying: False
      module_fusion: False

  data:
    train_ds:
      file_names: null
      global_batch_size: 8
      micro_batch_size: 2
      shuffle: True
      num_workers: 0
      pin_memory: True
      max_seq_length: 2048
      min_seq_length: 1
      drop_last: True
      concat_sampling_probabilities: null
      label_key: "output"
      add_eos: True
      add_sep: False
      add_bos: False
      truncation_field: "input"
      index_mapping_dir: null
      data_impl: "jsonl"

    validation_ds:
      file_names: null
      global_batch_size: 8
      micro_batch_size: 2
      shuffle: False
      num_workers: 0
      pin_memory: True
      max_seq_length: 2048
      min_seq_length: 1
      drop_last: False
      label_key: "output"
      add_eos: True
      add_sep: False
      add_bos: False
      truncation_field: "input"
      index_mapping_dir: null
      data_impl: "jsonl"

    # Tarred datasets
    tar_files: null
    metadata_path: null
    splits_string: null
    language: "en"
