# Training Configuration for LLaMA3 Models

# Model settings
model:
  type: "llama3"
  size: "8b"
  base_model_path: "meta-llama/Meta-Llama-3-8B"
  
# Data settings
data:
  train_file: "data/train.yaml"
  val_file: "data/val.yaml"
  test_file: "data/test.yaml"
  max_seq_length: 8192  # Longer context for LLaMA3
  batch_size: 2  # Smaller batch due to longer sequences
  num_workers: 4
  validation_split: 0.1
  
# Training hyperparameters
training:
  max_epochs: 3
  learning_rate: 1.0e-4  # Lower LR for LLaMA3
  warmup_steps: 200
  weight_decay: 0.01
  gradient_clip_val: 1.0
  accumulate_grad_batches: 8  # Higher accumulation for smaller batches
  precision: "bf16"
  strategy: "ddp"
  
# LoRA settings (optimized for LLaMA3)
lora:
  enabled: true
  rank: 64  # Higher rank for LLaMA3
  alpha: 128
  dropout: 0.05  # Lower dropout
  target_modules: ["q_proj", "v_proj", "k_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  
# Optimizer settings
optimizer:
  name: "adamw"
  lr: 1.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.01
  
# Scheduler settings
scheduler:
  name: "cosine"
  warmup_steps: 200
  max_steps: 1500
  min_lr: 1.0e-5
  
# Evaluation settings
evaluation:
  eval_steps: 250  # More frequent evaluation
  save_steps: 500
  metrics: ["perplexity", "bleu", "rouge"]
  max_eval_examples: 100
  
# Logging settings
logging:
  log_dir: "logs"
  log_every_n_steps: 10
  wandb_project: "nemo-llama3-finetune"
  tensorboard_dir: "logs/tensorboard"
  
# Checkpointing settings
checkpointing:
  checkpoint_dir: "checkpoints"
  save_top_k: 3
  monitor: "val_loss"
  mode: "min"
  save_last: true
  
# Hardware settings
hardware:
  gpus: 1
  nodes: 1
  accelerator: "gpu"
  devices: "auto"
  
# Deployment settings
deployment:
  output_dir: "deploy"
  model_name: null
  copy_tokenizer: true
  create_config: true
  create_readme: true
  create_inference_script: true
