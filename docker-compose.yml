version: '3.8'

services:
  nemo-finetuning:
    image: nvcr.io/nvidia/nemo:25.04.01.llama_nemotron_nano_vl
    container_name: nemo-finetuning-pipeline
    
    # GPU configuration
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
    # User configuration for proper permissions
    user: "${UID:-1000}:${GID:-1000}"

    # Environment variables
    environment:
      - CUDA_VISIBLE_DEVICES=all
      - NCCL_DEBUG=INFO
      - PYTHONPATH=/workspace
    
    # Volume mounts
    volumes:
      - /static-data/team_08/simple-nemo/fine-tune-demo:/workspace
      - /static-data/team_08/simple-nemo/fine-tune-demo/outputs:/workspace/outputs
      - /static-data/team_08/simple-nemo/fine-tune-demo/data:/workspace/data
      - /static-data/team_08/simple-nemo/fine-tune-demo/models:/workspace/models
    
    # Working directory
    working_dir: /workspace
    
    # Shared memory and limits
    shm_size: 8g
    ulimits:
      memlock: -1
      stack: 67108864
    
    # Port mappings
    ports:
      - "8888:8888"  # Jupyter Lab

    # Network configuration
    # network_mode: host  # Commented out to use port mapping
    
    # Keep container running
    tty: true
    stdin_open: true
    
    # Command to run
    command: >
      bash -c "
        echo 'NeMo Fine-tuning Pipeline Container Started';
        echo 'Creating necessary directories...';
        mkdir -p outputs data models;
        echo 'Available models:';
        python -c 'from configs.model_configs import list_available_models; print(list_available_models())' 2>/dev/null || echo 'Model configs not loaded yet';
        echo 'Starting Jupyter Lab...';
      "

# Optional: Networks configuration
networks:
  default:
    driver: bridge

# Optional: Volumes for persistent storage
volumes:
  nemo_cache:
    driver: local
  huggingface_cache:
    driver: local
