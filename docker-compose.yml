version: '3.8'

services:
  nemo-finetuning:
    image: nvcr.io/nvidia/nemo:24.07
    container_name: nemo-finetuning-24.07
    
    # GPU configuration
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
    # User configuration for proper permissions
    user: "${UID:-1000}:${GID:-1000}"

    # Environment variables
    environment:
      - CUDA_VISIBLE_DEVICES=all
      - NCCL_DEBUG=INFO
      - PYTHONPATH=/workspace
      - HF_TOKEN=${HF_TOKEN}
      - TRANSFORMERS_CACHE=/workspace/.cache/transformers
      - HF_HOME=/workspace/.cache/huggingface
    
    # Volume mounts
    volumes:
      - /static-data/team_08/simple-nemo/fine-tune-demo:/workspace
      - /static-data/team_08/simple-nemo/fine-tune-demo/outputs:/workspace/outputs
      - /static-data/team_08/simple-nemo/fine-tune-demo/data:/workspace/data
      - /static-data/team_08/simple-nemo/fine-tune-demo/models:/workspace/models
      - /static-data/team_08/simple-nemo/fine-tune-demo/.cache:/workspace/.cache
    
    # Working directory
    working_dir: /workspace
    
    # Shared memory and limits
    shm_size: 16g
    ulimits:
      memlock: -1
      stack: 67108864
    
    # Port mappings
    ports:
      - "8888:8888"  # Jupyter Lab
      - "6006:6006"  # TensorBoard
      - "7007:7007"  # Additional services

    # Network configuration
    # network_mode: host  # Commented out to use port mapping

    # Keep container running
    tty: true
    stdin_open: true

    # Startup command
    command: >
      bash -c "
        echo 'NeMo 24.07 Fine-tuning Environment Ready';
        echo 'Supported: CodeLlama-13B, Llama3-8B/70B';
        echo 'Host mount: /static-data/team_08/simple-nemo/fine-tune-demo';
        echo 'Run: python finetune_pipeline.py --help';
        /bin/bash
      "
    
    # Command to run
    command: >
      bash -c "
        echo 'NeMo Fine-tuning Pipeline Container Started';
        echo 'Creating necessary directories...';
        mkdir -p outputs data models;
        echo 'Available models:';
        python -c 'from configs.model_configs import list_available_models; print(list_available_models())' 2>/dev/null || echo 'Model configs not loaded yet';
        echo 'Starting Jupyter Lab...';
      "

# Optional: Networks configuration
networks:
  default:
    driver: bridge

# Optional: Volumes for persistent storage
volumes:
  nemo_cache:
    driver: local
  huggingface_cache:
    driver: local
