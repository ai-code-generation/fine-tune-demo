      ```java
      @Test
      public void testConfigureADCForS32K14_DUC13() {
          // Open project properties for ADC configuration
          bot.tree().select("S32KDUC1431_Project").contextMenu("Properties").click();
          bot.waitUntil(Conditions.shellIsActive("Properties for S32KDUC1431_Project"));

          // Navigate to S32K SDK configuration
          bot.tree().expandNode("S32K SDK").select("Peripheral Drivers");

          // Enable ADC driver
          bot.checkBox("ADC").select();
          bot.checkBox("ADC_SAR").select();

          // Configure ADC settings
          bot.tabItem("ADC Configuration").activate();
          bot.comboBoxWithLabel("Clock Source:").setSelection("BUS_CLK");
          bot.comboBoxWithLabel("Resolution:").setSelection("12-bit");
          bot.comboBoxWithLabel("Sample Time:").setSelection("56 cycles");

          // Configure ADC channels
          bot.button("Add Channel").click();
          bot.comboBoxWithLabel("Channel:").setSelection("ADC0_SE0");
          bot.textWithLabel("Pin:").setText("PTA0");
          bot.checkBox("Enable Interrupt").select();

          // Add second channel for temperature sensor
          bot.button("Add Channel").click();
          bot.comboBoxWithLabel("Channel:").setSelection("ADC0_SE1");
          bot.textWithLabel("Pin:").setText("PTA1");

          // Configure conversion trigger
          bot.comboBoxWithLabel("Trigger Source:").setSelection("Software");
          bot.checkBox("Continuous Conversion").select();

          // Apply settings
          bot.button("Apply and Close").click();

          // Add ADC initialization code to main.c
          bot.tree().expandNode("S32KDUC1431_Project").expandNode("Sources").select("main.c").doubleClick();

          SWTBotEditor editor = bot.editorByTitle("main.c");
          String adcCode = "\n    /* Initialize ADC */\n" +
                          "    ADC_DRV_ConfigConverter(INST_ADCONV1, &adConv1_ConvConfig0);\n" +
                          "    ADC_DRV_ConfigChan(INST_ADCONV1, 0U, &adConv1_ChnConfig0);\n" +
                          "    \n" +
                          "    /* Start ADC conversion */\n" +
                          "    ADC_DRV_StartConversion(INST_ADCONV1, 0U);\n";

          editor.toTextEditor().insertText(editor.toTextEditor().getText().indexOf("while(1)"), adcCode);
          editor.save();

          // Build project to verify ADC integration
          bot.tree().select("S32KDUC1431_Project");
          bot.menu("Project").menu("Build Project").click();

          // Wait for build completion
          bot.waitUntil(Conditions.shellIsActive("Build Progress"), 5000);
          bot.waitUntil(Conditions.shellCloses(bot.shell("Build Progress")), 30000);
      }
      ```
