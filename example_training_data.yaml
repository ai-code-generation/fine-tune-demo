      @Test
      public void testConfigurePWMForMotorControl() {
          // Open S32 Design Studio Configuration perspective
          bot.menu("Window").menu("Perspective").menu("Open Perspective").menu("Other...").click();
          bot.shell("Open Perspective").activate();
          bot.list().select("S32 Configuration Tool");
          bot.button("Open").click();

          // Open configuration for current project
          bot.tree().select("S32KDUC1431_Project").doubleClick();

          // Navigate to Clocks configuration
          bot.tabItem("Clocks").activate();

          // Configure FIRC for PWM timing
          bot.tree().expandNode("Clock Sources").select("FIRC");
          bot.checkBox("Enable FIRC").select();
          bot.textWithLabel("Frequency (MHz):").setText("48");

          // Configure FlexTimer for PWM
          bot.tabItem("Peripherals").activate();
          bot.tree().expandNode("Timers").select("FTM0");
          bot.checkBox("Enable FTM0").select();

          // Set PWM configuration
          bot.comboBoxWithLabel("Mode:").setSelection("Edge Aligned PWM");
          bot.textWithLabel("Frequency (Hz):").setText("1000");
          bot.textWithLabel("Duty Cycle (%):").setText("50");

          // Configure PWM channels
          bot.tabItem("Channels").activate();
          bot.button("Add Channel").click();
          bot.comboBoxWithLabel("Channel:").setSelection("Channel 0");
          bot.comboBoxWithLabel("Output Mode:").setSelection("PWM High True");
          bot.textWithLabel("Pin:").setText("PTD15");

          // Add second channel for complementary PWM
          bot.button("Add Channel").click();
          bot.comboBoxWithLabel("Channel:").setSelection("Channel 1");
          bot.comboBoxWithLabel("Output Mode:").setSelection("PWM High True");
          bot.textWithLabel("Pin:").setText("PTD16");

          // Configure deadtime for motor control
          bot.tabItem("Advanced").activate();
          bot.checkBox("Enable Deadtime").select();
          bot.textWithLabel("Deadtime Value:").setText("100");

          // Configure fault protection
          bot.checkBox("Enable Fault Protection").select();
          bot.comboBoxWithLabel("Fault Input:").setSelection("FTM_FAULT0");
          bot.textWithLabel("Fault Pin:").setText("PTA5");

          // Generate PWM code
          bot.button("Generate Code").click();
          bot.waitUntil(Conditions.shellIsActive("Code Generation Progress"));
          bot.waitUntil(Conditions.shellCloses(bot.shell("Code Generation Progress")), 20000);

          // Verify PWM files generated
          bot.tree().expandNode("S32KDUC1431_Project").expandNode("Generated_Code");
          assertTrue("FTM PWM driver should be generated",
              bot.tree().getTreeItem("S32KDUC1431_Project").getNode("Generated_Code")
                 .getNode("ftm_pwm_driver.c") != null);

          // Add PWM control code to main application
          bot.tree().expandNode("Sources").select("main.c").doubleClick();
          SWTBotEditor editor = bot.editorByTitle("main.c");

          String pwmControlCode = "\n    /* Initialize PWM for motor control */\n" +
                                 "    FTM_DRV_Init(INST_FLEXTIMER_PWM1, &flexTimer_pwm1_InitConfig, NULL);\n" +
                                 "    FTM_DRV_InitPwm(INST_FLEXTIMER_PWM1, &flexTimer_pwm1_PwmConfig);\n" +
                                 "    \n" +
                                 "    /* Start PWM generation */\n" +
                                 "    FTM_DRV_UpdatePwmChannel(INST_FLEXTIMER_PWM1, 0U, FTM_PWM_UPDATE_IN_DUTY_CYCLE, 5000U, 0U, true);\n";

          editor.toTextEditor().insertText(editor.toTextEditor().getText().indexOf("while(1)"), pwmControlCode);
          editor.save();
      }
      ```
