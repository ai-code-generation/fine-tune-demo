          bot.shell("Browse For Folder").activate();
          bot.tree().select("S32K14_DUC13_Automotive_Project");
          bot.button("OK").click();

          // Select project to import
          bot.checkBox("S32K14_DUC13_Automotive_Project").select();
          bot.checkBox("Copy projects into workspace").select();
          bot.button("Finish").click();

          // Wait for import completion
