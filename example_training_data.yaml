      ```java
      @Test
      public void testConfigureMPUForSafety() {
          // Open S32 Configuration Tool
          bot.tree().select("S32KDUC1431_Project").contextMenu("S32 Configuration Tool").click();
          bot.waitUntil(Conditions.shellIsActive("S32 Configuration Tool"));

          // Navigate to Safety features
          bot.tabItem("Safety").activate();
          bot.tree().select("MPU");

          // Enable MPU
          bot.checkBox("Enable MPU").select();

          // Configure memory regions
          bot.tabItem("Memory Regions").activate();

          // Add Flash memory region
          bot.button("Add Region").click();
          bot.textWithLabel("Region Name:").setText("Flash_Region");
          bot.textWithLabel("Start Address:").setText("0x00000000");
          bot.textWithLabel("End Address:").setText("0x0007FFFF");
          bot.comboBoxWithLabel("Access Rights:").setSelection("Read/Execute");
          bot.checkBox("Supervisor Mode").select();
          bot.checkBox("User Mode").select();

          // Add RAM region
          bot.button("Add Region").click();
          bot.textWithLabel("Region Name:").setText("RAM_Region");
          bot.textWithLabel("Start Address:").setText("0x1FFF8000");
          bot.textWithLabel("End Address:").setText("0x20007FFF");
          bot.comboBoxWithLabel("Access Rights:").setSelection("Read/Write");
          bot.checkBox("Supervisor Mode").select();
          bot.checkBox("User Mode").select();

          // Add peripheral region
          bot.button("Add Region").click();
          bot.textWithLabel("Region Name:").setText("Peripheral_Region");
          bot.textWithLabel("Start Address:").setText("0x40000000");
          bot.textWithLabel("End Address:").setText("0x4007FFFF");
          bot.comboBoxWithLabel("Access Rights:").setSelection("Read/Write");
          bot.checkBox("Supervisor Mode").select();
          bot.checkBox("User Mode").unselect();

          // Configure stack guard region
          bot.button("Add Region").click();
          bot.textWithLabel("Region Name:").setText("Stack_Guard");
          bot.textWithLabel("Start Address:").setText("0x20006000");
          bot.textWithLabel("End Address:").setText("0x20006FFF");
          bot.comboBoxWithLabel("Access Rights:").setSelection("No Access");

          // Configure MPU fault handling
          bot.tabItem("Fault Handling").activate();
          bot.checkBox("Enable Bus Fault").select();
          bot.checkBox("Enable Memory Management Fault").select();
          bot.textWithLabel("Fault Handler Priority:").setText("0");

          // Generate MPU configuration
          bot.button("Generate Code").click();
          bot.waitUntil(Conditions.shellIsActive("Code Generation"));
          bot.waitUntil(Conditions.shellCloses(bot.shell("Code Generation")), 15000);

          // Add MPU initialization code
          bot.tree().expandNode("S32KDUC1431_Project").expandNode("Sources").select("main.c").doubleClick();

          SWTBotEditor editor = bot.editorByTitle("main.c");
          String mpuCode = "\n/* MPU fault handler */\n" +
                          "void MemManage_Handler(void)\n" +
                          "{\n" +
                          "    /* Handle memory management fault */\n" +
                          "    uint32_t faultAddr = SCB->MMFAR;\n" +
                          "    \n" +
                          "    /* Log fault information */\n" +
                          "    /* Reset system or take corrective action */\n" +
                          "    NVIC_SystemReset();\n" +
                          "}\n" +
                          "\n" +
                          "void BusFault_Handler(void)\n" +
                          "{\n" +
                          "    /* Handle bus fault */\n" +
                          "    uint32_t faultAddr = SCB->BFAR;\n" +
                          "    \n" +
                          "    /* Log fault information */\n" +
                          "    /* Reset system or take corrective action */\n" +
                          "    NVIC_SystemReset();\n" +
                          "}\n\n";

          editor.toTextEditor().insertText(0, mpuCode);

          // Add MPU initialization in main
          String initCode = "\n    /* Initialize MPU */\n" +
                           "    MPU_DRV_Init(INST_MPU1, &mpu1_InitConfig0);\n" +
                           "    \n" +
                           "    /* Enable MPU */\n" +
                           "    MPU_DRV_Enable(INST_MPU1);\n";

          editor.toTextEditor().insertText(editor.toTextEditor().getText().indexOf("while(1)"), initCode);
          editor.save();

          // Verify MPU files
          assertTrue("MPU driver should be generated",
              bot.tree().expandNode("S32KDUC1431_Project").expandNode("Generated_Code")
                 .getNode("mpu_driver.c") != null);
      }
      ```
