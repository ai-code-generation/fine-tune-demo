      @Test
      public void testAddGPIODriverToS32K14_DUC13Project() {
          // Open project in Project Explorer
          bot.tree().select("S32KDUC1431_Project").doubleClick();
          
          // Navigate to SDK folder
          bot.tree().expandNode("S32KDUC1431_Project").expandNode("SDK").expandNode("platform").expandNode("drivers");
          
          // Right-click on drivers folder
          bot.tree().select("drivers").contextMenu("New").menu("Folder").click();
          bot.shell("New Folder").activate();
          bot.textWithLabel("Folder name:").setText("gpio");
          bot.button("Finish").click();
          
          // Add GPIO source files
          bot.tree().select("gpio").contextMenu("New").menu("File").click();
          bot.shell("New File").activate();
          bot.textWithLabel("File name:").setText("gpio_driver.c");
          bot.button("Finish").click();
          
          // Add GPIO header file
          bot.tree().select("gpio").contextMenu("New").menu("File").click();
          bot.shell("New File").activate();
          bot.textWithLabel("File name:").setText("gpio_driver.h");
          bot.button("Finish").click();
          
          // Open main.c to add GPIO initialization
          bot.tree().expandNode("S32KDUC1431_Project").expandNode("Sources").select("main.c").doubleClick();
          
          // Add include for GPIO driver
          SWTBotEditor editor = bot.editorByTitle("main.c");
          editor.toTextEditor().insertText(0, 0, "#include \"gpio_driver.h\"\n");
          
          // Save the file
          editor.save();
          
          // Verify files were created
          assertTrue("GPIO driver source should exist", 
              bot.tree().expandNode("S32KDUC1431_Project").expandNode("SDK").expandNode("platform")
                 .expandNode("drivers").expandNode("gpio").getNode("gpio_driver.c") != null);
          
          assertTrue("GPIO driver header should exist", 
              bot.tree().expandNode("S32KDUC1431_Project").expandNode("SDK").expandNode("platform")
                 .expandNode("drivers").expandNode("gpio").getNode("gpio_driver.h") != null);
      }
