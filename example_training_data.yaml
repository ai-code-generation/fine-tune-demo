          bot.text().setText("ISO26262_COMPLIANT");
          bot.button("OK").click();

          // Configure optimization for automotive
          bot.tree().select("Optimization");
          bot.comboBoxWithLabel("Optimization Level:").setSelection("Optimize for size (-Os)");
          bot.checkBox("Function sections (-ffunction-sections)").select();
          bot.checkBox("Data sections (-fdata-sections)").select();

          // Configure linker for automotive memory layout
          bot.tree().expandNode("Cross ARM C Linker").select("General");
          bot.checkBox("Remove unused sections (--gc-sections)").select();

          // Apply automotive configuration
          bot.button("Apply and Close").click();

          // Build imported project
          bot.tree().select("S32K14_DUC13_Automotive_Project");
          bot.menu("Project").menu("Build Project").click();

          // Wait for build completion
