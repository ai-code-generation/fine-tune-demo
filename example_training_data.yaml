          bot.tabItem("Startup").activate();
          bot.checkBox("Reset and Delay (seconds):").select();
          bot.textWithLabel("Reset and Delay (seconds):").setText("1");
          
          bot.checkBox("Halt").select();
          bot.checkBox("Load image").select();
          bot.checkBox("Load symbols").select();
          
          // Set initial breakpoint
          bot.checkBox("Set breakpoint at:").select();
          bot.textWithLabel("Set breakpoint at:").setText("main");
          
          // Apply configuration
          bot.button("Apply").click();
          
          // Test debug session
          bot.button("Debug").click();
          
          // Wait for debug perspective
          bot.waitUntil(Conditions.shellIsActive("Confirm Perspective Switch"), 5000);
          bot.button("Switch").click();
          
          // Verify debug session started
          bot.waitUntil(new ICondition() {
              @Override
              public boolean test() throws Exception {
                  return bot.viewByTitle("Debug").isActive();
              }
              
              @Override
              public void init(SWTBot bot) {}
              
              @Override
              public String getFailureMessage() {
                  return "Debug view did not become active";
              }
          }, 10000);
