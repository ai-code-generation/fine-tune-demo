          bot.textWithLabel("Project:").setText("S32KDUC1431_Project");
          bot.textWithLabel("C/C++ Application:").setText("Debug/S32KDUC1431_Project.elf");
          
          // Configure Debugger tab
          bot.tabItem("Debugger").activate();
          bot.comboBoxWithLabel("Interface:").setSelection("OpenSDA - USB1");
          bot.comboBoxWithLabel("Port:").setSelection("USB1");
          bot.comboBoxWithLabel("Device:").setSelection("S32K14_DUC13");
          
          // Set GDB command
          bot.textWithLabel("GDB Command:").setText("${cross_prefix}gdb${cross_suffix}");
          
