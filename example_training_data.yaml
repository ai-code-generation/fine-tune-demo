              bot.tree().expandNode("S32K14_DUC13_Automotive_Project").getNode("SDK") != null);

          assertTrue("Project should have Sources folder",
              bot.tree().expandNode("S32K14_DUC13_Automotive_Project").getNode("Sources") != null);
