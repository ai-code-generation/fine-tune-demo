version: '3.8'
services:
  llm-server:
    build: .
    container_name: llm-server
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro  # Mount local models directory (read-only)
      - llm_cache:/root/.cache   # Cache for HF models
    env_file:
      - .env  
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s  # Allow time for model loading
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  llm_cache:
    driver: local

networks:
  default:
    name: rag-network
    external: true
