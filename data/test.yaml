      @Test
      public void testConfigureTimerInterrupts() {
          // Open timer configuration
          bot.tree().select("S32KDUC1431_Project").contextMenu("S32 Configuration Tool").click();
          bot.waitUntil(Conditions.shellIsActive("S32 Configuration Tool"));
          
          // Navigate to timer peripherals
          bot.tabItem("Peripherals").activate();
          bot.tree().expandNode("Timers").select("LPIT0");
          
          // Enable LPIT0
          bot.checkBox("Enable LPIT0").select();
          
          // Configure timer channel 0
          bot.tabItem("Channels").activate();
          bot.button("Add Channel").click();
          bot.comboBoxWithLabel("Channel:").setSelection("Channel 0");
          bot.comboBoxWithLabel("Mode:").setSelection("Periodic Timer");
          bot.textWithLabel("Period (us):").setText("1000");
          bot.checkBox("Enable Interrupt").select();
          
          // Configure timer channel 1 for different frequency
          bot.button("Add Channel").click();
          bot.comboBoxWithLabel("Channel:").setSelection("Channel 1");
          bot.comboBoxWithLabel("Mode:").setSelection("Periodic Timer");
          bot.textWithLabel("Period (us):").setText("10000");
          bot.checkBox("Enable Interrupt").select();
          
          // Configure interrupt priorities
          bot.tabItem("Interrupts").activate();
          bot.tree().select("LPIT0_Ch0").textWithLabel("Priority:").setText("1");
          bot.tree().select("LPIT0_Ch1").textWithLabel("Priority:").setText("2");
          
          // Generate timer configuration
          bot.button("Generate Code").click();
          bot.waitUntil(Conditions.shellIsActive("Code Generation"));
          bot.waitUntil(Conditions.shellCloses(bot.shell("Code Generation")), 15000);
          
          // Add timer interrupt handlers
          bot.tree().expandNode("S32KDUC1431_Project").expandNode("Sources").select("main.c").doubleClick();
          
          SWTBotEditor editor = bot.editorByTitle("main.c");
          String timerCode = "\n/* Timer interrupt handlers */\n" +
                            "volatile uint32_t timer0_counter = 0;\n" +
                            "volatile uint32_t timer1_counter = 0;\n" +
                            "\n" +
                            "void LPIT0_Ch0_IRQHandler(void)\n" +
                            "{\n" +
                            "    /* Clear interrupt flag */\n" +
                            "    LPIT_DRV_ClearInterruptFlagTimerChannels(INST_LPIT0, (1 << 0));\n" +
                            "    \n" +
                            "    /* Increment counter */\n" +
                            "    timer0_counter++;\n" +
                            "    \n" +
                            "    /* Toggle LED every 1ms */\n" +
                            "    if(timer0_counter % 1000 == 0) {\n" +
                            "        PINS_DRV_TogglePins(PTD, (1 << 15));\n" +
                            "    }\n" +
                            "}\n" +
                            "\n" +
                            "void LPIT0_Ch1_IRQHandler(void)\n" +
                            "{\n" +
                            "    /* Clear interrupt flag */\n" +
                            "    LPIT_DRV_ClearInterruptFlagTimerChannels(INST_LPIT0, (1 << 1));\n" +
                            "    \n" +
                            "    /* Increment counter */\n" +
                            "    timer1_counter++;\n" +
                            "    \n" +
                            "    /* Perform periodic task every 10ms */\n" +
                            "    /* Add your periodic code here */\n" +
                            "}\n\n";
          
          editor.toTextEditor().insertText(0, timerCode);
          
          // Add timer initialization in main function
          String initCode = "\n    /* Initialize LPIT */\n" +
                           "    LPIT_DRV_Init(INST_LPIT0, &lpit0_InitConfig);\n" +
                           "    \n" +
                           "    /* Start timer channels */\n" +
                           "    LPIT_DRV_StartTimerChannels(INST_LPIT0, (1 << 0) | (1 << 1));\n";
          
          editor.toTextEditor().insertText(editor.toTextEditor().getText().indexOf("while(1)"), initCode);
          editor.save();
          
          // Verify timer files
          assertTrue("LPIT driver should be generated",
              bot.tree().expandNode("S32KDUC1431_Project").expandNode("Generated_Code")
                 .getNode("lpit_driver.c") != null);
      }
      ```
