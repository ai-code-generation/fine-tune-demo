  - role: user
    content: "How do I configure watchdog timer for S32K144 safety applications?"
  - role: assistant
    content: |
      ```java
      @Test
      public void testConfigureWatchdogForS32K144() {
          // Open S32 Configuration Tool
          bot.tree().select("S32KDUC1431_Project").contextMenu("S32 Configuration Tool").click();
          bot.waitUntil(Conditions.shellIsActive("S32 Configuration Tool"));
          
          // Navigate to Safety peripherals
          bot.tabItem("Peripherals").activate();
          bot.tree().expandNode("Safety").select("WDOG");
          
          // Enable watchdog
          bot.checkBox("Enable WDOG").select();
          
          // Configure watchdog settings
          bot.comboBoxWithLabel("Clock Source:").setSelection("LPO_CLK");
          bot.textWithLabel("Timeout (ms):").setText("1000");
          bot.checkBox("Enable in Debug Mode").unselect();
          bot.checkBox("Enable in Stop Mode").select();
          
          // Configure window mode
          bot.checkBox("Enable Window Mode").select();
          bot.textWithLabel("Window Start (ms):").setText("500");
          
          // Generate watchdog configuration
          bot.button("Generate Code").click();
          bot.waitUntil(Conditions.shellIsActive("Code Generation"));
          bot.waitUntil(Conditions.shellCloses(bot.shell("Code Generation")), 15000);
          
          // Add watchdog initialization to main.c
          bot.tree().expandNode("S32KDUC1431_Project").expandNode("Sources").select("main.c").doubleClick();
          
          SWTBotEditor editor = bot.editorByTitle("main.c");
          String wdogCode = "\n    /* Initialize Watchdog */\n" +
                           "    WDOG_DRV_Init(INST_WATCHDOG1, &watchdog1_Config0);\n" +
                           "    \n" +
                           "    while(1) {\n" +
                           "        /* Application code */\n" +
                           "        \n" +
                           "        /* Refresh watchdog */\n" +
                           "        WDOG_DRV_Trigger(INST_WATCHDOG1);\n" +
                           "        \n" +
                           "        /* Delay */\n" +
                           "        OSIF_TimeDelay(100);\n" +
                           "    }\n";
          
          editor.toTextEditor().selectRange(editor.toTextEditor().getText().indexOf("while(1)"), 
                                           editor.toTextEditor().getText().indexOf("}") - editor.toTextEditor().getText().indexOf("while(1)") + 1);
          editor.toTextEditor().insertText(wdogCode);
          editor.save();
          
          // Verify watchdog files
          assertTrue("Watchdog driver should be generated",
              bot.tree().expandNode("S32KDUC1431_Project").expandNode("Generated_Code")
                 .getNode("wdog_driver.c") != null);
      }
      ```
