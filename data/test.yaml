      @Test
      public void testConfigureLowPowerModes() {
          // Open power management configuration
          bot.tree().select("S32KDUC1431_Project").contextMenu("Properties").click();
          bot.waitUntil(Conditions.shellIsActive("Properties for S32KDUC1431_Project"));
          
          // Navigate to power management
          bot.tree().expandNode("S32K SDK").select("Power Manager");
          
          // Enable power management
          bot.checkBox("Enable Power Manager").select();
          
          // Configure power modes
          bot.button("Add Power Mode").click();
          bot.comboBoxWithLabel("Power Mode:").setSelection("VLPR (Very Low Power Run)");
          bot.textWithLabel("Mode Name:").setText("LowPowerRun");
          
          // Add stop mode
          bot.button("Add Power Mode").click();
          bot.comboBoxWithLabel("Power Mode:").setSelection("STOP1");
          bot.textWithLabel("Mode Name:").setText("DeepSleep");
          
          // Configure wake-up sources
          bot.tabItem("Wake-up Sources").activate();
          bot.checkBox("LPUART1").select();
          bot.checkBox("LPIT0").select();
          bot.checkBox("PORTC").select();
          
          // Configure clock settings for low power
          bot.tabItem("Clock Configuration").activate();
          bot.comboBoxWithLabel("VLPR Clock Source:").setSelection("SIRC");
          bot.textWithLabel("VLPR Core Frequency (MHz):").setText("2");
          
          // Apply power configuration
          bot.button("Apply and Close").click();
          
          // Add power management code to main.c
          bot.tree().expandNode("S32KDUC1431_Project").expandNode("Sources").select("main.c").doubleClick();
          
          SWTBotEditor editor = bot.editorByTitle("main.c");
          String powerCode = "\n    /* Power management initialization */\n" +
                            "    POWER_SYS_Init(&powerConfigsArr, POWER_MANAGER_CONFIG_CNT, &powerStaticCallbacksConfigsArr, POWER_MANAGER_CALLBACK_CNT);\n" +
                            "    \n" +
                            "    /* Configure wake-up interrupt */\n" +
                            "    INT_SYS_EnableIRQ(PORTC_IRQn);\n" +
                            "    \n" +
                            "    while(1) {\n" +
                            "        /* Normal operation */\n" +
                            "        \n" +
                            "        /* Enter low power mode */\n" +
                            "        POWER_SYS_SetMode(1U, POWER_MANAGER_POLICY_AGREEMENT);\n" +
                            "        \n" +
                            "        /* Wait for wake-up */\n" +
                            "        __WFI();\n" +
                            "    }\n";
          
          editor.toTextEditor().insertText(editor.toTextEditor().getText().indexOf("while(1)"), powerCode);
          editor.save();
          
          // Build and verify
          bot.tree().select("S32KDUC1431_Project");
          bot.menu("Project").menu("Build Project").click();
          bot.waitUntil(Conditions.shellIsActive("Build Progress"), 5000);
          bot.waitUntil(Conditions.shellCloses(bot.shell("Build Progress")), 30000);
      }
      ```
