      @Test
      public void testConfigureI2CForS32K144() {
          // Open configuration tool
          bot.tree().select("S32KDUC1431_Project").contextMenu("S32 Configuration Tool").click();
          bot.waitUntil(Conditions.shellIsActive("S32 Configuration Tool"));
          
          // Navigate to I2C configuration
          bot.tabItem("Peripherals").activate();
          bot.tree().expandNode("Communication").select("LPI2C0");
          
          // Enable I2C
          bot.checkBox("Enable LPI2C0").select();
          
          // Configure I2C as master
          bot.comboBoxWithLabel("Mode:").setSelection("Master");
          bot.textWithLabel("Baud Rate (Hz):").setText("100000");
          bot.comboBoxWithLabel("Operating Mode:").setSelection("Standard Mode");
          
          // Configure timing parameters
          bot.textWithLabel("Setup Time (ns):").setText("250");
          bot.textWithLabel("Hold Time (ns):").setText("300");
          bot.textWithLabel("High Period (ns):").setText("4000");
          bot.textWithLabel("Low Period (ns):").setText("4700");
          
          // Configure pins
          bot.tabItem("Pins").activate();
          bot.tree().expandNode("LPI2C0").select("LPI2C0_SCL");
          bot.comboBoxWithLabel("Pin:").setSelection("PTA2");
          bot.checkBox("Enable Pull-up").select();
          
          bot.tree().select("LPI2C0_SDA");
          bot.comboBoxWithLabel("Pin:").setSelection("PTA3");
          bot.checkBox("Enable Pull-up").select();
          
          // Configure slave addresses
          bot.tabItem("Slave Addresses").activate();
          bot.button("Add Slave").click();
          bot.textWithLabel("Slave Address:").setText("0x48");
          bot.textWithLabel("Description:").setText("Temperature Sensor");
          
          bot.button("Add Slave").click();
          bot.textWithLabel("Slave Address:").setText("0x68");
          bot.textWithLabel("Description:").setText("RTC Module");
          
          // Generate I2C configuration
          bot.button("Generate Code").click();
          bot.waitUntil(Conditions.shellIsActive("Code Generation"));
          bot.waitUntil(Conditions.shellCloses(bot.shell("Code Generation")), 15000);
          
          // Add I2C communication code
          bot.tree().expandNode("S32KDUC1431_Project").expandNode("Sources").select("main.c").doubleClick();
          
          SWTBotEditor editor = bot.editorByTitle("main.c");
          String i2cCode = "\n    /* I2C communication setup */\n" +
                          "    uint8_t txBuffer[2] = {0x00, 0x01};\n" +
                          "    uint8_t rxBuffer[2] = {0};\n" +
                          "    \n" +
                          "    /* Initialize I2C */\n" +
                          "    LPI2C_DRV_MasterInit(INST_LPI2C0, &lpi2c0_MasterConfig0, &lpi2c0MasterState);\n" +
                          "    \n" +
                          "    while(1) {\n" +
                          "        /* Read temperature sensor */\n" +
                          "        LPI2C_DRV_MasterSendDataBlocking(INST_LPI2C0, txBuffer, 1, true, 1000);\n" +
                          "        LPI2C_DRV_MasterReceiveDataBlocking(INST_LPI2C0, rxBuffer, 2, true, 1000);\n" +
                          "        \n" +
                          "        /* Process sensor data */\n" +
                          "        uint16_t temperature = (rxBuffer[0] << 8) | rxBuffer[1];\n" +
                          "        \n" +
                          "        /* Delay before next reading */\n" +
                          "        OSIF_TimeDelay(1000);\n" +
                          "    }\n";
          
          editor.toTextEditor().insertText(editor.toTextEditor().getText().indexOf("while(1)"), i2cCode);
          editor.save();
          
          // Verify I2C files
          assertTrue("LPI2C driver should be generated",
              bot.tree().expandNode("S32KDUC1431_Project").expandNode("Generated_Code")
                 .getNode("lpi2c_driver.c") != null);
      }
      ```
