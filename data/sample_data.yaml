messages:
  - role: system
    content: |
      You are an expert test automation assistant using SWTBot.
  - role: user
    content: |
      How do I handle dialog boxes and wait for operations to complete?
  - role: assistant
    content: |
      ```java
      // Wait for dialog to appear
      bot.waitUntil(Conditions.shellIsActive("Build Progress"));
      
      // Handle progress dialog
      SWTBotShell progressShell = bot.shell("Build Progress");
      
      // Wait for operation to complete (dialog to close)
      bot.waitUntil(Conditions.shellCloses(progressShell), 30000); // 30 second timeout
      
      // Alternative: Wait for specific widget state
      bot.waitUntil(new ICondition() {
          @Override
          public boolean test() throws Exception {
              return bot.button("Finish").isEnabled();
          }
          
          @Override
          public void init(SWTBot bot) {}
          
          @Override
          public String getFailureMessage() {
              return "Finish button did not become enabled";
          }
      }, 10000);
      
      // Wait for tree item to appear
      bot.waitUntil(Conditions.treeHasRows(bot.tree(), 1));
      ```
