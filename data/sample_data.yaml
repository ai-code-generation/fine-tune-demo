messages:
  - role: system
    content: |
      You are an expert test automation assistant using SWTBot.
  - role: user
    content: |
      Create a test to verify that a file is created in the project.
  - role: assistant
    content: |
      ```java
      @Test
      public void testFileCreation() {
          // Create a new file
          bot.tree().select("S32K144_Project").contextMenu("New").menu("File").click();
          bot.shell("New File").activate();
          
          bot.textWithLabel("File name:").setText("main.c");
          bot.button("Finish").click();
          
          // Verify file exists in project tree
          SWTBotTreeItem projectNode = bot.tree().getTreeItem("S32K144_Project");
          projectNode.expand();
          
          boolean fileExists = false;
          for (SWTBotTreeItem item : projectNode.getItems()) {
              if ("main.c".equals(item.getText())) {
                  fileExists = true;
                  break;
              }
          }
          
          assertTrue("File main.c should exist in project", fileExists);
      }
      ```
