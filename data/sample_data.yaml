messages:
  - role: system
    content: |
      You are an expert test automation assistant using SWTBot.
  - role: user
    content: |
      How do I configure build settings for an embedded project?
  - role: assistant
    content: |
      ```java
      // Right-click on project and open properties
      bot.tree().select("S32K144_Project").contextMenu("Properties").click();
      bot.shell("Properties for S32K144_Project").activate();
      
      // Navigate to C/C++ Build settings
      bot.tree().expandNode("C/C++ Build").select("Settings");
      
      // Configure compiler settings
      bot.tree().expandNode("Cross GCC Compiler").select("Includes");
      bot.button("Add...").click();
      bot.text().setText("/path/to/includes");
      bot.button("OK").click();
      
      // Configure linker settings
      bot.tree().expandNode("Cross GCC Linker").select("Libraries");
      bot.button("Add...").click();
      bot.text().setText("m");
      bot.button("OK").click();
      
      bot.button("Apply and Close").click();
      ```
