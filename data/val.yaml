    content: "You are an expert test automation assistant specializing in S32K144 microcontroller projects using SWTBot automation in Eclipse IDE."
  - role: user
    content: "How do I configure UART communication for S32K144 project debugging?"
  - role: assistant
    content: |
      ```java
      @Test
      public void testConfigureUARTForS32K144() {
          // Open S32 Configuration Tool
          bot.tree().select("S32KDUC1431_Project").contextMenu("Open With").menu("S32 Configuration Tool").click();
          bot.waitUntil(Conditions.shellIsActive("S32 Configuration Tool"));
          
          // Navigate to Peripherals
          bot.tabItem("Peripherals").activate();
          bot.tree().expandNode("Communication").select("LPUART1");
          
          // Enable LPUART1
          bot.checkBox("Enable LPUART1").select();
          
          // Configure UART settings
          bot.comboBoxWithLabel("Baud Rate:").setSelection("115200");
          bot.comboBoxWithLabel("Data Bits:").setSelection("8");
          bot.comboBoxWithLabel("Parity:").setSelection("None");
          bot.comboBoxWithLabel("Stop Bits:").setSelection("1");
          
          // Configure pins
          bot.tabItem("Pins").activate();
          bot.tree().expandNode("LPUART1").select("LPUART1_TX");
          bot.comboBoxWithLabel("Pin:").setSelection("PTC6");
          
          bot.tree().select("LPUART1_RX");
          bot.comboBoxWithLabel("Pin:").setSelection("PTC7");
          
          // Enable interrupts
          bot.tabItem("Interrupts").activate();
          bot.checkBox("Enable RX Interrupt").select();
          bot.textWithLabel("Priority:").setText("3");
          
          // Generate configuration
          bot.button("Generate Code").click();
          bot.waitUntil(Conditions.shellIsActive("Code Generation"));
          bot.waitUntil(Conditions.shellCloses(bot.shell("Code Generation")), 15000);
          
          // Verify UART driver files
          assertTrue("LPUART driver should be generated",
              bot.tree().expandNode("S32KDUC1431_Project").expandNode("Generated_Code")
                 .getNode("lpuart_driver.c") != null);
      }
      ```
