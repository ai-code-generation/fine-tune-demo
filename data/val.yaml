  - role: user
    content: "How do I configure the system clock for optimal S32K144 performance?"
  - role: assistant
    content: |
      ```java
      @Test
      public void testConfigureSystemClockS32K144() {
          // Open clock configuration tool
          bot.tree().select("S32KDUC1431_Project").contextMenu("S32 Configuration Tool").click();
          bot.waitUntil(Conditions.shellIsActive("S32 Configuration Tool"));
          
          // Navigate to Clocks tab
          bot.tabItem("Clocks").activate();
          
          // Configure SOSC (System Oscillator)
          bot.tree().expandNode("Clock Sources").select("SOSC");
          bot.checkBox("Enable SOSC").select();
          bot.textWithLabel("External Crystal Frequency (MHz):").setText("8");
          bot.comboBoxWithLabel("Gain:").setSelection("High Gain");
          
          // Configure SPLL (System PLL)
          bot.tree().select("SPLL");
          bot.checkBox("Enable SPLL").select();
          bot.comboBoxWithLabel("Reference Clock:").setSelection("SOSC");
          bot.textWithLabel("VCO Frequency (MHz):").setText("160");
          bot.textWithLabel("Output Frequency (MHz):").setText("80");
          
          // Configure system clock
          bot.tree().expandNode("System Clocks").select("Core Clock");
          bot.comboBoxWithLabel("Source:").setSelection("SPLL_CLK");
          bot.comboBoxWithLabel("Divider:").setSelection("1");
          
          // Configure bus clock
          bot.tree().select("Bus Clock");
          bot.comboBoxWithLabel("Source:").setSelection("Core Clock");
          bot.comboBoxWithLabel("Divider:").setSelection("2");
          
          // Configure flash clock
          bot.tree().select("Flash Clock");
          bot.comboBoxWithLabel("Source:").setSelection("Core Clock");
          bot.comboBoxWithLabel("Divider:").setSelection("3");
          
          // Verify clock tree
          bot.button("Validate Clock Tree").click();
          bot.waitUntil(Conditions.shellIsActive("Clock Validation"));
          
          // Check for warnings or errors
          SWTBotText validationResult = bot.textWithLabel("Validation Result:");
          assertTrue("Clock configuration should be valid", 
              validationResult.getText().contains("Valid"));
          
          bot.button("OK").click();
          
          // Generate clock configuration
          bot.button("Generate Code").click();
          bot.waitUntil(Conditions.shellIsActive("Code Generation"));
          bot.waitUntil(Conditions.shellCloses(bot.shell("Code Generation")), 15000);
          
          // Verify clock configuration files
          assertTrue("Clock configuration should be generated",
              bot.tree().expandNode("S32KDUC1431_Project").expandNode("Generated_Code")
                 .getNode("clock_config.c") != null);
      }
      ```
