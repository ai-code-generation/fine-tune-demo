    content: "You are an expert test automation assistant specializing in S32K144 microcontroller projects using SWTBot automation in Eclipse IDE."
  - role: user
    content: "Create a test to configure interrupt handling for S32K144 external signals."
  - role: assistant
    content: |
      ```java
      @Test
      public void testConfigureExternalInterrupts() {
          // Open project configuration
          bot.tree().select("S32KDUC1431_Project").contextMenu("Properties").click();
          bot.waitUntil(Conditions.shellIsActive("Properties for S32KDUC1431_Project"));
          
          // Navigate to interrupt configuration
          bot.tree().expandNode("S32K SDK").select("Interrupt Manager");
          
          // Enable external interrupt
          bot.checkBox("Enable PORT Interrupts").select();
          
          // Configure PORTC interrupt
          bot.button("Add Interrupt").click();
          bot.comboBoxWithLabel("Interrupt Source:").setSelection("PORTC");
          bot.textWithLabel("Priority:").setText("2");
          bot.checkBox("Enable").select();
          
          // Configure specific pin interrupt
          bot.tabItem("Pin Configuration").activate();
          bot.tree().select("PORTC").expandNode("PORTC").select("PTC12");
          
          // Set pin as input with interrupt
          bot.comboBoxWithLabel("Direction:").setSelection("Input");
          bot.comboBoxWithLabel("Interrupt:").setSelection("Rising Edge");
          bot.checkBox("Enable Pull-up").select();
          
          // Apply configuration
          bot.button("Apply and Close").click();
          
          // Add interrupt handler to main.c
          bot.tree().expandNode("S32KDUC1431_Project").expandNode("Sources").select("main.c").doubleClick();
          
          SWTBotEditor editor = bot.editorByTitle("main.c");
          String interruptCode = "\n/* External interrupt handler */\n" +
                                "void PORTC_IRQHandler(void)\n" +
                                "{\n" +
                                "    /* Check if PTC12 triggered interrupt */\n" +
                                "    if(PINS_DRV_GetPortIntFlag(PORTC) & (1 << 12))\n" +
                                "    {\n" +
                                "        /* Clear interrupt flag */\n" +
                                "        PINS_DRV_ClearPinIntFlagCmd(PORTC, 12);\n" +
                                "        \n" +
                                "        /* Handle interrupt - toggle LED */\n" +
                                "        PINS_DRV_TogglePins(PTD, (1 << 15));\n" +
                                "    }\n" +
                                "}\n\n";
          
          editor.toTextEditor().insertText(0, interruptCode);
          editor.save();
          
          // Build and verify
          bot.tree().select("S32KDUC1431_Project");
          bot.menu("Project").menu("Build Project").click();
          bot.waitUntil(Conditions.shellIsActive("Build Progress"), 5000);
          bot.waitUntil(Conditions.shellCloses(bot.shell("Build Progress")), 30000);
      }
      ```
