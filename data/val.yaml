      ```java
      @Test
      public void testConfigureSPIForS32K144() {
          // Open peripheral configuration
          bot.tree().select("S32KDUC1431_Project").contextMenu("S32 Configuration Tool").click();
          bot.waitUntil(Conditions.shellIsActive("S32 Configuration Tool"));
          
          // Navigate to peripherals
          bot.tabItem("Peripherals").activate();
          bot.tree().expandNode("Communication").select("LPSPI0");
          
          // Enable LPSPI0
          bot.checkBox("Enable LPSPI0").select();
          
          // Configure SPI as master
          bot.comboBoxWithLabel("Mode:").setSelection("Master");
          bot.textWithLabel("Baud Rate (Hz):").setText("1000000");
          bot.comboBoxWithLabel("Clock Polarity:").setSelection("Active High");
          bot.comboBoxWithLabel("Clock Phase:").setSelection("Capture on Leading Edge");
          bot.comboBoxWithLabel("Bit Order:").setSelection("MSB First");
          
          // Configure data frame
          bot.textWithLabel("Frame Size (bits):").setText("8");
          bot.comboBoxWithLabel("CS Polarity:").setSelection("Active Low");
          
          // Configure pins
          bot.tabItem("Pins").activate();
          bot.tree().expandNode("LPSPI0").select("LPSPI0_SCK");
          bot.comboBoxWithLabel("Pin:").setSelection("PTB2");
          
          bot.tree().select("LPSPI0_SIN");
          bot.comboBoxWithLabel("Pin:").setSelection("PTB3");
          
          bot.tree().select("LPSPI0_SOUT");
          bot.comboBoxWithLabel("Pin:").setSelection("PTB4");
          
          bot.tree().select("LPSPI0_PCS0");
          bot.comboBoxWithLabel("Pin:").setSelection("PTB5");
          
          // Configure DMA (optional)
          bot.tabItem("DMA").activate();
          bot.checkBox("Enable TX DMA").select();
          bot.checkBox("Enable RX DMA").select();
          
          // Generate SPI configuration
          bot.button("Generate Code").click();
          bot.waitUntil(Conditions.shellIsActive("Code Generation"));
          bot.waitUntil(Conditions.shellCloses(bot.shell("Code Generation")), 15000);
          
          // Add SPI test code to main.c
          bot.tree().expandNode("S32KDUC1431_Project").expandNode("Sources").select("main.c").doubleClick();
          
          SWTBotEditor editor = bot.editorByTitle("main.c");
          String spiCode = "\n    /* SPI communication test */\n" +
                          "    uint8_t txBuffer[4] = {0xAA, 0xBB, 0xCC, 0xDD};\n" +
                          "    uint8_t rxBuffer[4] = {0};\n" +
                          "    \n" +
                          "    /* Initialize SPI */\n" +
                          "    LPSPI_DRV_MasterInit(INST_LPSPI0, &lpspi0State, &lpspi0_MasterConfig0);\n" +
                          "    \n" +
                          "    /* Perform SPI transfer */\n" +
                          "    LPSPI_DRV_MasterTransferBlocking(INST_LPSPI0, txBuffer, rxBuffer, 4, 1000);\n";
          
          editor.toTextEditor().insertText(editor.toTextEditor().getText().indexOf("while(1)"), spiCode);
          editor.save();
          
          // Verify SPI files generated
          assertTrue("LPSPI driver should be generated",
              bot.tree().expandNode("S32KDUC1431_Project").expandNode("Generated_Code")
                 .getNode("lpspi_driver.c") != null);
      }
      ```
